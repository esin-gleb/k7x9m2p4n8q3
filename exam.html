<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Экзамен · Тесты АиР</title>
</head><body>

<div class="header">
  <a class="back" href="index.html">← Темы</a>
  <h1>🎓 Экзамен</h1>
</div>

<div id="topbarWrap" style="display:none">
  <div class="progress-wrap"><div class="progress-bar exam" id="pbar" style="width:0%"></div></div>
  <div class="topbar"><span id="progressText"></span><span id="scoreLive"></span></div>
</div>

<div id="stage">Загрузка…</div>

<script src="app.js"></script>
<script>
registerSW();

const EXAM_SIZE = 100;
const MIN_TOPIC_QS = 5; // порог для окрашивания темы по результату экзамена
const HISTORY_KEY = 'exam_history';

let TOPICS = [];        // topic meta
let ALL = [];           // dedupe not needed after new data — but keep for safety
let deck = [], idx = 0, wrong = [], answered = false;

function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){return []}}
function saveHistory(entry){
  const h = loadHistory(); h.unshift(entry);
  if(h.length>10) h.length=10;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}

function showIntro(){
  const h = loadHistory();
  let historyHtml = '';
  if(h.length){
    historyHtml = '<div class="stats-banner" style="flex-direction:column;align-items:stretch;gap:6px"><b style="text-align:left">Прошлые попытки:</b>';
    h.forEach(r=>{
      const c = passClass(r.pct);
      const d = new Date(r.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      historyHtml += `<div style="display:flex;justify-content:space-between"><span>${d}</span><span class="${c}"><b>${r.right}/${r.total}</b> (${r.pct}%)</span></div>`;
    });
    historyHtml += '</div>';
  }
  document.getElementById('stage').innerHTML = `
    ${historyHtml}
    <div class="result">
      <h2 style="margin-top:0">Тестовый экзамен</h2>
      <p style="color:#555">${Math.min(EXAM_SIZE, ALL.length)} случайных вопросов из ${ALL.length} задач всей базы.</p>
      <p style="color:#888;font-size:13px">Порог «Московский врач»: 80%. Правильные ответы отмечаются как освоенные, ошибки возвращают задачи в зубрёжку соответствующей темы.</p>
      <div class="nav" style="margin-top:20px">
        <button class="btn dark" onclick="startExam()">Начать экзамен</button>
      </div>
    </div>`;
}

function startExam(){
  document.getElementById('topbarWrap').style.display='block';
  const pool = shuffle([...ALL]);
  deck = pool.slice(0, Math.min(EXAM_SIZE, pool.length));
  idx=0; wrong=[]; render();
}

function updateProgress(){
  const pct=Math.round(100*idx/deck.length);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${idx+1} / ${deck.length}`;
  const right = idx - wrong.length;
  const c = idx>0 ? passClass(Math.round(100*right/idx)) : '';
  document.getElementById('scoreLive').innerHTML = idx>0 ? `<span class="${c}">✓ ${right} / ✗ ${wrong.length}</span>` : '';
}

function render(){
  answered=false;
  updateProgress();
  const item=deck[idx];
  const shuffled=shuffle([...item.opts]);
  const optsHtml=shuffled.map(o=>`<button class="opt" onclick="chooseQuiz(this)">${esc(o)}</button>`).join('');
  document.getElementById('stage').innerHTML=`
    <div class="card">
      <div class="scen">${esc(item.scen)}</div>
      <div class="q">${esc(item.q)}</div>
      <div>${optsHtml}</div>
      <div class="nav">
        <button class="btn yellow" id="nextBtn" onclick="skipQuiz()">Пропустить</button>
      </div>
    </div>`;
}

function skipQuiz(){
  if(answered)return; answered=true;
  const item=deck[idx];
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  markUnmastered(item._topic, item.id);
  wrong.push(idx);
  toNextBtn();
}
function chooseQuiz(btn){
  if(answered)return; answered=true;
  const item=deck[idx];
  const chosen=btn.textContent;
  const isRight=norm(chosen)===norm(item.correct);
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  if(isRight){ markMastered(item._topic, item.id); }
  else { btn.classList.add('wrong'); markUnmastered(item._topic, item.id); wrong.push(idx); }
  toNextBtn();
}
function toNextBtn(){
  const nb=document.getElementById('nextBtn');
  nb.classList.remove('yellow'); nb.classList.add('green');
  nb.textContent=idx===deck.length-1?'Результат':'Далее →';
  nb.onclick=advance;
}
function advance(){idx++;if(idx>=deck.length)finish();else render()}

function finish(){
  const total=deck.length, right=total-wrong.length, pct=Math.round(100*right/total);
  document.getElementById('pbar').style.width='100%';
  document.getElementById('progressText').textContent=`${total}/${total}`;
  // aggregate stats per topic and update lastResult per topic (if enough questions from topic)
  const byTopic = {};
  deck.forEach((item, i)=>{
    const t = item._topic;
    if (!byTopic[t]) byTopic[t] = {n:0, right:0};
    byTopic[t].n += 1;
    if (!wrong.includes(i)) byTopic[t].right += 1;
  });
  // Update per-topic lastResult only when >MIN_TOPIC_QS
  Object.entries(byTopic).forEach(([tid,st])=>{
    if (st.n > MIN_TOPIC_QS){
      const p = Math.round(100*st.right/st.n);
      setLastResult(tid, p);
    }
  });
  saveHistory({date:new Date().toISOString(), right, total, pct});
  showStats(byTopic, right, total, pct);
}

function showStats(byTopic, right, total, pct){
  const c = passClass(pct);
  const passed = pct>=80;
  const verdict = passed?'🏆 Сдано (≥80%)':'❌ Не сдано (<80%)';
  // build stats table
  const rows = Object.entries(byTopic).map(([tid, st])=>{
    const t = TOPICS.find(x=>x.id===tid);
    const name = t ? ((t.emoji||'') + ' ' + t.name) : tid;
    const topicPct = Math.round(100*st.right/st.n);
    const cls = st.n > MIN_TOPIC_QS ? passClass(topicPct) : 'neutral';
    const pctColor = st.n > MIN_TOPIC_QS ? passClass(topicPct) : '';
    return {name, n:st.n, right:st.right, pct:topicPct, cls, pctColor};
  }).sort((a,b)=>b.n-a.n);
  const rowsHtml = rows.map(r=>`
    <tr class="${r.cls}">
      <td>${r.name}</td>
      <td class="num">${r.right} / ${r.n}</td>
      <td class="pct ${r.pctColor}">${r.pct}%</td>
    </tr>`).join('');

  let errorsHtml = '';
  if (wrong.length){
    errorsHtml = '<div class="review"><h3>Ошибки (' + wrong.length + ')</h3>';
    wrong.forEach(i=>{
      const it = deck[i];
      const t = TOPICS.find(x=>x.id===it._topic);
      const topicLabel = t ? ((t.emoji||'')+' '+t.name) : it._topic;
      errorsHtml += `<div class="review-item">
        <div style="font-size:11px;color:#888;margin-bottom:4px">${topicLabel}</div>
        <b>${esc(it.q)}</b><br>
        <small style="color:#666">${esc(it.scen.slice(0,220))}${it.scen.length>220?'…':''}</small>
        <div class="ck">✓ ${esc(it.correct)}</div>
      </div>`;
    });
    errorsHtml += '</div>';
  } else {
    errorsHtml = '<div class="review empty"><h3>Ошибок нет 🎉</h3></div>';
  }

  const buttonsHtml = passed
    ? `<div class="nav"><a class="btn secondary" href="index.html">← К темам</a></div>`
    : `<div class="nav">
         <button class="btn dark" onclick="startExam()">Повторить</button>
         <a class="btn secondary" href="index.html">← К темам</a>
       </div>`;

  document.getElementById('stage').innerHTML = `
    <div class="result">
      <div class="score ${c}">${right} / ${total}</div>
      <div class="verdict">${verdict} · ${pct}%</div>
      ${buttonsHtml}
      <h3 style="text-align:left;margin-top:24px">По темам</h3>
      <p style="text-align:left;font-size:12px;color:#888;margin:0 0 8px">
        Цветом отмечены темы, где было больше ${MIN_TOPIC_QS} вопросов.
      </p>
      <table class="stats-table">
        <thead><tr><th>Тема</th><th style="text-align:right">Ответы</th><th style="text-align:right">%</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      ${errorsHtml}
    </div>`;
}

// Load all topics: attach _topic to each item
async function loadAll(){
  try {
    TOPICS = await fetch('data/topics.json').then(r=>r.json());
    const bundles = await Promise.all(TOPICS.map(t => fetch('data/'+t.id+'.json').then(r=>r.json()).then(items=>items.map(x=>({...x, _topic: t.id})))));
    ALL = [].concat(...bundles);
    showIntro();
  } catch(e){
    document.getElementById('stage').innerHTML='<div style="color:#c00">Ошибка: '+e.message+'</div>';
  }
}
loadAll();
</script>
</body></html>
