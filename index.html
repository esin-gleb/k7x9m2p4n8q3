<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Тесты АиР</title>
</head><body>

<div class="head">
  <h1>Тесты АиР</h1>
  <div class="head-actions">
    <a href="exam.html" class="action-btn exam">🎓 Экзамен</a>
    <button id="qrBtn" class="action-btn" style="display:none" onclick="showQR()">📤 QR</button>
  </div>
</div>

<div class="grid" id="grid">Загрузка…</div>

<div id="qrModal" class="modal" onclick="if(event.target===this)hideQR()">
  <div class="modal-body">
    <h3>Ссылка на приложение</h3>
    <div class="qr-container" id="qrContainer"></div>
    <p id="qrUrl"></p>
    <button onclick="hideQR()">Закрыть</button>
  </div>
</div>

<footer>
  Прогресс хранится локально в этом браузере ·
  <a href="#" onclick="if(confirm('Сбросить ВЕСЬ прогресс: освоенные задачи, историю тестов и экзаменов?')){Object.keys(localStorage).filter(k=>k.startsWith('mastered_')||k.startsWith('lastResult_')||k.startsWith('exam_')).forEach(k=>localStorage.removeItem(k));location.reload()}return false" style="color:#999">Сброс всего</a>
</footer>

<script src="qrcode.min.js"></script>
<script src="app.js"></script>
<script>
registerSW();
const isAdmin = checkAdminGate();
if (isAdmin) document.getElementById('qrBtn').style.display = 'inline-flex';

function showQR(){
  const url = location.origin + location.pathname;
  const c = document.getElementById('qrContainer'); c.innerHTML='';
  new QRCode(c, { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrModal').classList.add('show');
}
function hideQR(){ document.getElementById('qrModal').classList.remove('show') }

function renderTile(t){
  const mastered = getMastered(t.id).size;
  const total = t.count;
  const masteredPct = Math.round(100*mastered/total);
  const last = getLastResult(t.id);
  // Default = fail (red). Green only if last result ≥80%.
  const tileClass = (last && last.pct >= 80) ? 'pass' : 'fail';
  const lastLine = last
    ? `<div class="tile-progress"><span>Посл. результат</span><span class="pct ${passClass(last.pct)}">${last.pct}%</span></div>`
    : `<div class="tile-progress" style="color:#7a5150;font-style:italic">— ещё не проходили</div>`;
  return `<a class="tile ${tileClass}" href="topic.html?id=${t.id}">
    <div class="tile-title">${t.emoji||''} ${t.name}</div>
    <div class="tile-count">${total} задач · освоено ${mastered}</div>
    <div class="mastered-bar"><div class="mastered-bar-fill" style="width:${masteredPct}%"></div></div>
    ${lastLine}
  </a>`;
}

fetch('data/topics.json').then(r=>r.json()).then(topics=>{
  document.getElementById('grid').innerHTML = topics.map(renderTile).join('');
}).catch(e=>{document.getElementById('grid').innerHTML='<div style="color:#c00">Ошибка: '+e.message+'</div>'});
</script>
</body></html>
