<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>АиР — подготовка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,sans-serif;max-width:820px;margin:0 auto;padding:14px;background:#f2f4f7;color:#1a1a1a;line-height:1.4}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile-title{font-weight:600;font-size:15px;line-height:1.25;min-height:2.5em}
.tile-count{font-size:11px;color:#888;margin-top:-4px}
.stat-row{display:flex;align-items:center;gap:6px;font-size:12px}
.stat-row .em{font-size:16px;flex-shrink:0}
.bar-wrap{flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;position:relative}
.bar{height:100%;transition:width .3s}
.pct{font-weight:700;font-size:12px;min-width:34px;text-align:right}
.g{color:#28a745}
.y{color:#e69500}
.r{color:#dc3545}
.bar.g{background:#28a745}
.bar.y{background:#f0ad00}
.bar.r{background:#dc3545}
.bar.n{background:#c0c0c0}
.empty{color:#999;font-style:italic;font-size:11px;padding:2px 0}
footer{margin-top:20px;padding:10px;text-align:center;font-size:11px;color:#999}
</style>
</head><body>

<h1>АиР — подготовка</h1>
<div class="sub">Порог «Московский врач»: 80%</div>

<div class="grid" id="grid">Загрузка…</div>

<footer>
  Прогресс хранится локально в этом браузере ·
  <a href="#" onclick="if(confirm('Сбросить всю статистику по всем темам?')){Object.keys(localStorage).filter(k=>k.startsWith('stats_')||k.startsWith('lastCycle_')).forEach(k=>localStorage.removeItem(k));location.reload()}return false" style="color:#999">Сброс всего</a>
</footer>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}

function colorFor(pct){
  if(pct >= 80) return 'g';
  if(pct >= 70) return 'y';
  return 'r';
}

function renderTile(t){
  // load last cycle stats
  const cram = JSON.parse(localStorage.getItem('lastCycle_'+t.id+'_cram') || 'null');
  const quiz = JSON.parse(localStorage.getItem('lastCycle_'+t.id+'_quiz') || 'null');
  function statRow(emoji, label, data){
    if(!data || !data.total) return `<div class="stat-row"><span class="em">${emoji}</span><span class="empty">— не пройдено</span></div>`;
    const pct = Math.round(100*data.right/data.total);
    const c = colorFor(pct);
    return `<div class="stat-row"><span class="em">${emoji}</span><div class="bar-wrap"><div class="bar ${c}" style="width:${pct}%"></div></div><span class="pct ${c}">${pct}%</span></div>`;
  }
  return `<a class="tile" href="topic.html?id=${t.id}">
    <div class="tile-title">${t.name}</div>
    <div class="tile-count">${t.count} задач</div>
    ${statRow('🧠','cram',cram)}
    ${statRow('✅','quiz',quiz)}
  </a>`;
}

fetch('data/topics.json').then(r=>r.json()).then(topics=>{
  document.getElementById('grid').innerHTML = topics.map(renderTile).join('');
}).catch(e=>{document.getElementById('grid').innerHTML='<div style="color:#c00">Ошибка загрузки: '+e.message+'</div>'});
</script>
</body></html>
