<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Тесты АиР</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,sans-serif;max-width:820px;margin:0 auto;padding:14px;background:#f2f4f7;color:#1a1a1a;line-height:1.4}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.head-actions{display:flex;gap:6px}
.action-btn{background:#0066cc;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.action-btn.exam{background:#8b1a1a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile-title{font-weight:600;font-size:15px;line-height:1.25;min-height:2.5em}
.tile-count{font-size:11px;color:#888;margin-top:-4px}
.stat-row{display:flex;align-items:center;gap:6px;font-size:12px}
.stat-row .em{font-size:16px;flex-shrink:0}
.bar-wrap{flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.bar{height:100%;transition:width .3s}
.pct{font-weight:700;font-size:12px;min-width:34px;text-align:right}
.g{color:#28a745}.y{color:#e69500}.r{color:#dc3545}
.bar.g{background:#28a745}.bar.y{background:#f0ad00}.bar.r{background:#dc3545}
.empty{color:#999;font-style:italic;font-size:11px}
footer{margin-top:20px;padding:10px;text-align:center;font-size:11px;color:#999}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-body{background:#fff;border-radius:12px;padding:20px;max-width:340px;width:100%;text-align:center}
.modal-body h3{margin:0 0 12px;font-size:18px}
.modal-body .qr-container{background:#fff;padding:12px;border-radius:8px;display:flex;justify-content:center;margin-bottom:12px}
.modal-body p{font-size:13px;color:#666;margin:8px 0;word-break:break-all}
.modal-body button{margin-top:12px;padding:10px 20px;background:#666;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;width:100%}
</style>
</head><body>

<div class="head">
  <h1>Тесты АиР</h1>
  <div class="head-actions">
    <a href="exam.html" class="action-btn exam">🎓 Экзамен</a>
    <button id="qrBtn" class="action-btn" style="display:none" onclick="showQR()">📤 QR</button>
  </div>
</div>

<div class="grid" id="grid">Загрузка…</div>

<div id="qrModal" class="modal" onclick="if(event.target===this)hideQR()">
  <div class="modal-body">
    <h3>Ссылка на приложение</h3>
    <div class="qr-container" id="qrContainer"></div>
    <p id="qrUrl"></p>
    <button onclick="hideQR()">Закрыть</button>
  </div>
</div>

<footer>
  Прогресс хранится локально в этом браузере ·
  <a href="#" onclick="if(confirm('Сбросить всю статистику по всем темам?')){Object.keys(localStorage).filter(k=>k.startsWith('stats_')||k.startsWith('lastCycle_')||k.startsWith('exam_')).forEach(k=>localStorage.removeItem(k));location.reload()}return false" style="color:#999">Сброс всего</a>
</footer>

<script src="qrcode.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}

const ADMIN_TOKEN = "b275e48a41c9df356b7e404927eb70b8";
const params = new URLSearchParams(location.search);
if (params.get('admin') === ADMIN_TOKEN) {
  localStorage.setItem('admin_flag','1');
  history.replaceState({}, '', location.pathname);
} else if (params.get('admin') === '0') {
  localStorage.removeItem('admin_flag');
  history.replaceState({}, '', location.pathname);
}
const isAdmin = localStorage.getItem('admin_flag') === '1';
if (isAdmin) document.getElementById('qrBtn').style.display = 'inline-flex';

function showQR(){
  const url = location.origin + location.pathname;
  const container = document.getElementById('qrContainer');
  container.innerHTML = '';
  new QRCode(container, { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrModal').classList.add('show');
}
function hideQR(){ document.getElementById('qrModal').classList.remove('show') }

function colorFor(pct){ if(pct>=80) return 'g'; if(pct>=70) return 'y'; return 'r' }

function renderTile(t){
  const cram = JSON.parse(localStorage.getItem('lastCycle_'+t.id+'_cram') || 'null');
  const quiz = JSON.parse(localStorage.getItem('lastCycle_'+t.id+'_quiz') || 'null');
  function statRow(emoji, data){
    if(!data || !data.total) return `<div class="stat-row"><span class="em">${emoji}</span><span class="empty">— не пройдено</span></div>`;
    const pct = Math.round(100*data.right/data.total);
    const c = colorFor(pct);
    return `<div class="stat-row"><span class="em">${emoji}</span><div class="bar-wrap"><div class="bar ${c}" style="width:${pct}%"></div></div><span class="pct ${c}">${pct}%</span></div>`;
  }
  return `<a class="tile" href="topic.html?id=${t.id}">
    <div class="tile-title">${t.name}</div>
    <div class="tile-count">${t.count} задач</div>
    ${statRow('🧠',cram)}
    ${statRow('✅',quiz)}
  </a>`;
}

fetch('data/topics.json').then(r=>r.json()).then(topics=>{
  document.getElementById('grid').innerHTML = topics.map(renderTile).join('');
}).catch(e=>{document.getElementById('grid').innerHTML='<div style="color:#c00">Ошибка загрузки: '+e.message+'</div>'});
</script>
</body></html>
