<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Тесты АиР</title>
</head><body>

<div class="head">
  <h1>Тесты АиР</h1>
  <div class="head-actions">
    <a href="exam.html" class="action-btn exam">🎓 Экзамен</a>
    <a href="exam.html?size=20" class="action-btn" style="background:#5a3d8a" title="Мини-экзамен: 20 случайных">🎲</a>
    <button id="exportBtn" class="action-btn" style="display:none;background:#555" onclick="exportOverrides()" title="Экспорт переносов и ловушек">💾</button>
    <button id="qrBtn" class="action-btn" style="display:none" onclick="showQR()" title="Показать QR">📤</button>
  </div>
</div>

<div class="grid" id="grid">Загрузка…</div>

<div id="qrModal" class="modal" onclick="if(event.target===this)hideQR()">
  <div class="modal-body">
    <h3>Ссылка на приложение</h3>
    <div class="qr-container" id="qrContainer"></div>
    <p id="qrUrl"></p>
    <button onclick="hideQR()">Закрыть</button>
  </div>
</div>

<footer>
  Прогресс хранится локально в этом браузере ·
  <a href="#" onclick="if(confirm('Сбросить ВЕСЬ прогресс: отвеченные задачи, историю тестов, экзаменов, переносы тем, ловушки?')){Object.keys(localStorage).filter(k=>k.startsWith('answered_')||k.startsWith('lastResult_')||k.startsWith('exam_')||k.startsWith('mini_')||k==='topicOverrides'||k==='traps').forEach(k=>localStorage.removeItem(k));location.reload()}return false" style="color:#999">Сброс всего</a>
</footer>

<script src="qrcode.min.js"></script>
<script src="app.js"></script>
<script>
registerSW();
const isAdmin = checkAdminGate();
if (isAdmin) {
  document.getElementById('qrBtn').style.display = 'inline-flex';
  document.getElementById('exportBtn').style.display = 'inline-flex';
}

function showQR(){
  const url = location.origin + location.pathname;
  const c = document.getElementById('qrContainer'); c.innerHTML='';
  new QRCode(c, { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrModal').classList.add('show');
}
function hideQR(){ document.getElementById('qrModal').classList.remove('show') }

function exportOverrides(){
  const o = getOverrides();
  const traps = [...getTraps()];
  const data = { exported_at: new Date().toISOString(), overrides: o, traps };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'overrides_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
}

async function render(){
  const topics = await fetch('data/topics.json').then(r=>r.json());
  const allItems = await loadAllItems(topics);
  const counts = countPerTopic(allItems);
  const traps = getTraps();

  const tiles = topics.map(t=>{
    const total = counts[t.id] || 0;
    if (t.id === 'other' && total === 0) return '';
    const answeredIds = getAnswered(t.id);
    const currentIds = new Set(itemsForTopic(allItems, t.id).map(x=>x.id));
    let answered = 0, trapCount = 0;
    currentIds.forEach(id=>{
      if (answeredIds.has(id)) answered++;
      if (traps.has(id)) trapCount++;
    });
    const answeredPct = total ? Math.round(100*answered/total) : 0;
    const last = getLastResult(t.id);
    const tileClass = (last && last.pct >= 80) ? 'pass' : 'fail';
    const lastLine = last
      ? `<div class="tile-progress"><span>Посл. результат</span><span class="pct ${passClass(last.pct)}">${last.pct}%</span></div>`
      : `<div class="tile-progress" style="color:#7a5150;font-style:italic">— ещё не проходили</div>`;
    const trapLine = trapCount ? `<div style="font-size:11px;color:#8a6d00">🪤 ловушек: ${trapCount}</div>` : '';
    return `<a class="tile ${tileClass}" href="topic.html?id=${t.id}">
      <div class="tile-title">${t.emoji||''} ${t.name}</div>
      <div class="tile-count">${total} задач · отвечено ${answered}</div>
      <div class="mastered-bar"><div class="mastered-bar-fill" style="width:${answeredPct}%"></div></div>
      ${trapLine}
      ${lastLine}
    </a>`;
  }).filter(x=>x).join('');
  document.getElementById('grid').innerHTML = tiles;
}
render().catch(e=>{document.getElementById('grid').innerHTML='<div style="color:#c00">Ошибка: '+e.message+'</div>'});
</script>
</body></html>
