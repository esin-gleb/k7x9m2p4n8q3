<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Тема · Тесты АиР</title>
</head><body>

<div class="header">
  <a class="back" href="index.html">← Темы</a>
  <h1 id="title">…</h1>
</div>

<div class="modes">
  <button class="mode-btn active" id="modeQuiz" onclick="setMode('quiz')">✅ Тест</button>
  <button class="mode-btn" id="modeCram" onclick="setMode('cram')">🧠 Повторение</button>
</div>

<div class="stats-banner" id="statsBanner"></div>
<div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="topbar"><span id="progressText"></span><button class="action-btn ghost" style="padding:4px 10px;font-size:12px" onclick="resetTopic()">Сброс темы</button></div>

<div id="stage">Загрузка…</div>

<div id="moveModal" class="modal" onclick="if(event.target===this)hideMoveModal()">
  <div class="modal-body">
    <h3>Переместить в тему</h3>
    <div class="cur-topic" id="curTopicLine"></div>
    <select class="select-topic" id="targetTopic">
      <option value="">— выбери тему —</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideMoveModal()">Отмена</button>
      <button class="btn-primary" id="moveConfirmBtn" onclick="doMove()" disabled>Переместить</button>
    </div>
    <button class="btn-restore" id="restoreBtn" style="display:none" onclick="doRestore()">Вернуть на исходную</button>
  </div>
</div>

<script src="app.js"></script>
<script>
registerSW();

const params = new URLSearchParams(location.search);
const TOPIC_ID = params.get('id') || 'cpr';
let TOPICS = [];
let ALL_ITEMS_RAW = []; // all items across all topics with _origTopic
let TOPIC_ITEMS = [];   // items belonging to current effective topic
let TOPIC_NAME = '';
let mode='quiz', deck=[], idx=0, wrong=[], answered=false;
let currentEditingItem = null;

function recomputeTopicItems(){
  TOPIC_ITEMS = itemsForTopic(ALL_ITEMS_RAW, TOPIC_ID);
}

function refreshStatsBanner(){
  const total = TOPIC_ITEMS.length;
  const answeredIds = getAnswered(TOPIC_ID);
  const currentIds = new Set(TOPIC_ITEMS.map(x=>x.id));
  let answered = 0;
  answeredIds.forEach(id=>{ if(currentIds.has(id)) answered++; });
  const pct = total ? Math.round(100*answered/total) : 0;
  const last = getLastResult(TOPIC_ID);
  const lastHtml = last ? ` · Посл. результат: <span class="${passClass(last.pct)}"><b>${last.pct}%</b></span>` : '';
  document.getElementById('statsBanner').innerHTML = `
    <span>Отвечено: <span class="m-count">${answered}/${total}</span></span>
    <div class="bar-mini"><div style="width:${pct}%"></div></div>
    <span>${pct}%${lastHtml}</span>`;
}

function resetTopic(){
  if(!confirm('Сбросить весь прогресс по этой теме (отвеченные, последний результат)?')) return;
  localStorage.removeItem('answered_'+TOPIC_ID);
  localStorage.removeItem('lastResult_'+TOPIC_ID);
  refreshStatsBanner();
  setMode(mode);
}

function setMode(m){
  mode = m;
  document.getElementById('modeCram').classList.toggle('active', m==='cram');
  document.getElementById('modeQuiz').classList.toggle('active', m==='quiz');
  startRun(false);
}

function startRun(onlyWrong){
  let pool;
  if (onlyWrong && wrong.length){
    pool = wrong.map(i=>TOPIC_ITEMS[i]).filter(Boolean);
    pool = shuffle(pool);
  } else {
    // Both modes: unanswered first, then answered
    pool = orderedPool(TOPIC_ITEMS, TOPIC_ID);
  }
  if (!pool.length){
    document.getElementById('stage').innerHTML = '<div class="empty-state"><p>В теме нет задач.</p></div>';
    return;
  }
  deck = pool.map((item)=>({item, origIdx: TOPIC_ITEMS.indexOf(item)}));
  idx=0; wrong=[]; render();
}

function updateProgress(){
  const pct=Math.round(100*idx/deck.length);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${idx+1} / ${deck.length}`;
}

function changeTopicBtn(){
  return `<button class="change-topic-btn" onclick="showMoveModal()">↦ Тема</button>`;
}
function trapBadge(item){
  return isTrap(item.id) ? '<span class="trap-badge" title="Помечен как ловушка">🪤 ловушка</span>' : '';
}
function postAnswerRow(item){
  const trapActive = isTrap(item.id) ? ' active' : '';
  const url = buildGoogleUrl(item);
  return `<div class="card-actions" style="margin-top:12px;justify-content:flex-start">
    <button class="trap-btn${trapActive}" onclick="onToggleTrap()">🪤 ${isTrap(item.id)?'ловушка':'пометить'}</button>
    <a class="google-btn" href="${url}" target="_blank" rel="noopener" title="Спросить Google (AI Mode)">${GOOGLE_G_SVG}</a>
  </div>`;
}
function onToggleTrap(){
  toggleTrap(currentEditingItem.id);
  // rerender post-answer buttons
  const btn = document.querySelector('.trap-btn');
  const active = isTrap(currentEditingItem.id);
  btn.classList.toggle('active', active);
  btn.innerHTML = '🪤 ' + (active?'ловушка':'пометить');
  // also refresh badge in card top
  const badgeSlot = document.getElementById('trapBadgeSlot');
  if (badgeSlot) badgeSlot.innerHTML = trapBadge(currentEditingItem);
}

function render(){
  answered=false;
  updateProgress();
  const {item}=deck[idx];
  currentEditingItem = item;
  const stage=document.getElementById('stage');
  const header = `<div class="card-actions">${changeTopicBtn()}</div>`;
  const badge = `<span id="trapBadgeSlot">${trapBadge(item)}</span>`;
  if(mode==='cram'){
    stage.innerHTML=`
      <div class="card">
        ${header}
        <div class="scen">${badge}${esc(item.cram_key)}</div>
        <div class="q">${esc(item.cram_q)}</div>
        <div id="answerArea"></div>
        <div class="nav" id="cramNav">
          <button class="btn" onclick="revealCram()">Показать ответ</button>
        </div>
      </div>`;
  } else {
    const shuffled=shuffle([...item.opts]);
    const optsHtml=shuffled.map(o=>`<button class="opt" onclick="chooseQuiz(this)">${esc(o)}</button>`).join('');
    stage.innerHTML=`
      <div class="card">
        ${header}
        <div class="scen">${badge}${esc(item.scen)}</div>
        <div class="q">${esc(item.q)}</div>
        <div>${optsHtml}</div>
        <div class="nav">
          <button class="btn yellow" id="nextBtn" onclick="skipQuiz()">Пропустить</button>
        </div>
      </div>`;
  }
}

function revealCram(){
  const {item}=deck[idx];
  document.getElementById('answerArea').innerHTML=`<div class="answer-reveal">${esc(item.correct)}</div>` + postAnswerRow(item);
  document.getElementById('cramNav').innerHTML=`
    <button class="btn red" onclick="rateCram(false)">Не помню</button>
    <button class="btn green" onclick="rateCram(true)">Помню</button>`;
}
function rateCram(ok){
  const {item}=deck[idx];
  if(ok){ markAnswered(TOPIC_ID, item.id); }
  else  { markUnanswered(TOPIC_ID, item.id); wrong.push(deck[idx].origIdx); }
  advance();
}

function skipQuiz(){
  if(answered)return; answered=true;
  const {item}=deck[idx];
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  markUnanswered(TOPIC_ID, item.id);
  wrong.push(deck[idx].origIdx);
  appendPostAnswerRow();
  toNextBtn();
}
function chooseQuiz(btn){
  if(answered)return; answered=true;
  const {item}=deck[idx];
  const chosen=btn.textContent;
  const isRight=norm(chosen)===norm(item.correct);
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  if(isRight){ markAnswered(TOPIC_ID, item.id); }
  else { btn.classList.add('wrong'); markUnanswered(TOPIC_ID, item.id); wrong.push(deck[idx].origIdx); }
  appendPostAnswerRow();
  toNextBtn();
}
function appendPostAnswerRow(){
  const item = deck[idx].item;
  const nav = document.querySelector('.nav');
  nav.insertAdjacentHTML('beforebegin', postAnswerRow(item));
}
function toNextBtn(){
  const nb=document.getElementById('nextBtn');
  nb.classList.remove('yellow'); nb.classList.add('green');
  nb.textContent=idx===deck.length-1?'Результат':'Далее →';
  nb.onclick=advance;
}
function advance(){idx++;if(idx>=deck.length)finish();else render()}

function finish(){
  const total=deck.length, right=total-wrong.length, pct=Math.round(100*right/total);
  if (mode==='quiz'){ setLastResult(TOPIC_ID, pct); }
  refreshStatsBanner();
  document.getElementById('pbar').style.width='100%';
  document.getElementById('progressText').textContent=`${total}/${total}`;
  const c=passClass(pct); const passed = pct>=80;
  const verdict = passed?'🏆 Сдано (≥80%)':'❌ Не сдано (<80%)';
  let reviewHtml='';
  if(wrong.length){
    reviewHtml='<div class="review"><h3>Ошибки</h3>';
    wrong.forEach(i=>{
      const it=TOPIC_ITEMS[i];
      if(!it) return;
      reviewHtml+=`<div class="review-item"><b>${esc(it.cram_q||it.q)}</b><br><small style="color:#666">${esc((it.cram_key||it.scen).slice(0,250))}</small><div class="ck">✓ ${esc(it.correct)}</div></div>`;
    });
    reviewHtml+='</div>';
  } else {
    reviewHtml='<div class="review empty"><h3>Ошибок нет 🎉</h3></div>';
  }
  const modeLabel = mode==='cram' ? 'Повторение' : 'Тест';
  const buttonsHtml = passed
    ? `<div class="nav"><a class="btn secondary" href="index.html">← К темам</a></div>`
    : `<div class="nav">
         <button class="btn" onclick="startRun(false)">Повторить</button>
         <a class="btn secondary" href="index.html">← К темам</a>
       </div>`;
  document.getElementById('stage').innerHTML=`
    <div class="result">
      <div style="color:#666;font-size:13px">${modeLabel}</div>
      <div class="score ${c}">${right} / ${total}</div>
      <div class="verdict">${verdict} · ${pct}%</div>
      ${buttonsHtml}
      ${reviewHtml}
    </div>`;
}

// --- Move modal ---
function showMoveModal(){
  const item = currentEditingItem;
  const eff = effectiveTopic(item);
  const overrides = getOverrides();
  const hasOverride = overrides[item.id];
  const curT = TOPICS.find(x=>x.id===eff);
  document.getElementById('curTopicLine').textContent = 'Сейчас: ' + (curT?curT.emoji+' '+curT.name:eff);
  const sel = document.getElementById('targetTopic');
  sel.innerHTML = '<option value="">— выбери тему —</option>' +
    TOPICS.filter(t=>t.id!==eff).map(t=>`<option value="${t.id}">${t.emoji||''} ${t.name}</option>`).join('');
  document.getElementById('moveConfirmBtn').disabled = true;
  sel.onchange = ()=>{ document.getElementById('moveConfirmBtn').disabled = !sel.value };
  document.getElementById('restoreBtn').style.display = hasOverride ? 'block' : 'none';
  if (hasOverride){
    const orig = TOPICS.find(x=>x.id===item._origTopic);
    document.getElementById('restoreBtn').textContent = 'Вернуть на исходную (' + (orig?orig.name:item._origTopic) + ')';
  }
  document.getElementById('moveModal').classList.add('show');
}
function hideMoveModal(){ document.getElementById('moveModal').classList.remove('show') }
function doMove(){
  const item = currentEditingItem;
  const target = document.getElementById('targetTopic').value;
  if (!target) return;
  setOverride(item.id, target, TOPICS);
  hideMoveModal();
  // Задача переехала — пересчитываем и убираем её из текущей темы
  recomputeTopicItems();
  refreshStatsBanner();
  // Уберём из текущего deck и покажем следующую (или финиш)
  deck = deck.filter((d,i)=>i<=idx?d:d.item.id!==item.id?d:null).filter(Boolean);
  // Если текущий элемент был удалён из TOPIC_ITEMS (перенос), просто идём дальше
  if (idx >= deck.length) finish();
  else render();
}
function doRestore(){
  const item = currentEditingItem;
  clearOverride(item.id, TOPICS);
  hideMoveModal();
  recomputeTopicItems();
  refreshStatsBanner();
  // если задача была в этой теме через override и теперь ушла — advance
  const stillHere = TOPIC_ITEMS.some(x=>x.id===item.id);
  if (!stillHere){
    deck = deck.filter((d,i)=>d.item.id!==item.id);
    if (idx >= deck.length) finish();
    else render();
  }
}

// bootstrap
(async ()=>{
  try {
    TOPICS = await fetch('data/topics.json').then(r=>r.json());
    const t = TOPICS.find(x=>x.id===TOPIC_ID);
    TOPIC_NAME = t ? t.name : TOPIC_ID;
    document.title = TOPIC_NAME + ' — АиР';
    document.getElementById('title').textContent = (t?.emoji||'') + ' ' + TOPIC_NAME;
    ALL_ITEMS_RAW = await loadAllItems(TOPICS);
    recomputeTopicItems();
    refreshStatsBanner();
    setMode('quiz');
  } catch(e){
    document.getElementById('stage').innerHTML='<div style="color:#c00">Ошибка: '+e.message+'</div>';
  }
})();
</script>
</body></html>
