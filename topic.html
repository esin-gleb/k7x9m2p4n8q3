<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Тема · Тесты АиР</title>
</head><body>

<div class="header">
  <a class="back" href="index.html">← Темы</a>
  <h1 id="title">…</h1>
</div>

<div class="modes">
  <button class="mode-btn active" id="modeCram" onclick="setMode('cram')">🧠 Зубрёжка</button>
  <button class="mode-btn" id="modeQuiz" onclick="setMode('quiz')">✅ Тест</button>
</div>

<div class="stats-banner" id="statsBanner"></div>
<div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<div class="topbar"><span id="progressText"></span><button class="action-btn ghost" style="padding:4px 10px;font-size:12px" onclick="resetTopic()">Сброс темы</button></div>

<div id="stage">Загрузка…</div>

<script src="app.js"></script>
<script>
registerSW();

const params = new URLSearchParams(location.search);
const TOPIC_ID = params.get('id') || 'cpr';
let ALL_ITEMS = [];
let TOPIC_NAME = '';
let mode='cram', deck=[], idx=0, wrong=[], answered=false;

function refreshStatsBanner(){
  const total = ALL_ITEMS.length;
  const mastered = getMastered(TOPIC_ID).size;
  const pct = total ? Math.round(100*mastered/total) : 0;
  const last = getLastResult(TOPIC_ID);
  const lastHtml = last ? ` · Посл. результат: <span class="${passClass(last.pct)}"><b>${last.pct}%</b></span>` : '';
  document.getElementById('statsBanner').innerHTML = `
    <span>Освоено: <span class="m-count">${mastered}/${total}</span></span>
    <div class="bar-mini"><div style="width:${pct}%"></div></div>
    <span>${pct}%${lastHtml}</span>`;
}

function resetTopic(){
  if(!confirm('Сбросить весь прогресс по этой теме?')) return;
  localStorage.removeItem('mastered_'+TOPIC_ID);
  localStorage.removeItem('lastResult_'+TOPIC_ID);
  refreshStatsBanner();
  setMode(mode);
}

function setMode(m){
  const mastered = getMastered(TOPIC_ID);
  const unmasteredCount = ALL_ITEMS.filter(x=>!mastered.has(x.id)).length;
  // Block cram if all mastered
  if (m==='cram' && unmasteredCount === 0){
    document.getElementById('modeCram').classList.remove('active');
    document.getElementById('modeCram').disabled = true;
    document.getElementById('modeQuiz').classList.add('active');
    document.getElementById('modeQuiz').disabled = false;
    document.getElementById('stage').innerHTML = `
      <div class="empty-state">
        <h3>🎉 Тема пройдена</h3>
        <p>Все ${ALL_ITEMS.length} задач помечены как освоенные.</p>
        <p>Запусти тест, чтобы проверить знания — задачи, где ошибёшься, вернутся в зубрёжку.</p>
        <div class="nav" style="margin-top:16px">
          <button class="btn" onclick="setMode('quiz')">Перейти к тесту →</button>
        </div>
      </div>`;
    document.getElementById('pbar').style.width='0%';
    document.getElementById('progressText').textContent='';
    return;
  }
  document.getElementById('modeCram').disabled = false;
  document.getElementById('modeQuiz').disabled = false;
  mode = m;
  document.getElementById('modeCram').classList.toggle('active', m==='cram');
  document.getElementById('modeQuiz').classList.toggle('active', m==='quiz');
  startRun(false);
}

function startRun(onlyWrong){
  const mastered = getMastered(TOPIC_ID);
  let pool;
  if (onlyWrong && wrong.length){
    pool = wrong.map(i=>ALL_ITEMS[i]);
  } else if (mode==='cram'){
    pool = ALL_ITEMS.filter(x=>!mastered.has(x.id));
    if (!pool.length){ setMode('cram'); return; } // hits empty-state
  } else {
    pool = ALL_ITEMS; // full test always
  }
  deck = shuffle(pool.map((item)=>({item, origIdx: ALL_ITEMS.indexOf(item)})));
  idx=0; wrong=[]; render();
}

function updateProgress(){
  const pct=Math.round(100*idx/deck.length);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${idx+1} / ${deck.length}`;
}

function render(){
  answered=false;
  updateProgress();
  const {item}=deck[idx];
  const stage=document.getElementById('stage');
  if(mode==='cram'){
    stage.innerHTML=`
      <div class="card">
        <div class="scen">${esc(item.cram_key)}</div>
        <div class="q">${esc(item.cram_q)}</div>
        <div id="answerArea"></div>
        <div class="nav" id="cramNav">
          <button class="btn" onclick="revealCram()">Показать ответ</button>
        </div>
      </div>`;
  } else {
    const shuffled=shuffle([...item.opts]);
    const optsHtml=shuffled.map(o=>`<button class="opt" onclick="chooseQuiz(this)">${esc(o)}</button>`).join('');
    stage.innerHTML=`
      <div class="card">
        <div class="scen">${esc(item.scen)}</div>
        <div class="q">${esc(item.q)}</div>
        <div>${optsHtml}</div>
        <div class="nav">
          <button class="btn yellow" id="nextBtn" onclick="skipQuiz()">Пропустить</button>
        </div>
      </div>`;
  }
}

function revealCram(){
  const {item}=deck[idx];
  document.getElementById('answerArea').innerHTML=`<div class="answer-reveal">${esc(item.correct)}</div>`;
  document.getElementById('cramNav').innerHTML=`
    <button class="btn red" onclick="rateCram(false)">Не помню</button>
    <button class="btn green" onclick="rateCram(true)">Помню</button>`;
}
function rateCram(ok){
  const {item}=deck[idx];
  if(ok){ markMastered(TOPIC_ID, item.id); }
  else  { markUnmastered(TOPIC_ID, item.id); wrong.push(deck[idx].origIdx); }
  advance();
}

function skipQuiz(){
  if(answered)return; answered=true;
  const {item}=deck[idx];
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  markUnmastered(TOPIC_ID, item.id);
  wrong.push(deck[idx].origIdx);
  toNextBtn();
}
function chooseQuiz(btn){
  if(answered)return; answered=true;
  const {item}=deck[idx];
  const chosen=btn.textContent;
  const isRight=norm(chosen)===norm(item.correct);
  document.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('disabled');
    if(norm(b.textContent)===norm(item.correct))b.classList.add('correct');
  });
  if(isRight){ markMastered(TOPIC_ID, item.id); }
  else { btn.classList.add('wrong'); markUnmastered(TOPIC_ID, item.id); wrong.push(deck[idx].origIdx); }
  toNextBtn();
}
function toNextBtn(){
  const nb=document.getElementById('nextBtn');
  nb.classList.remove('yellow'); nb.classList.add('green');
  nb.textContent=idx===deck.length-1?'Результат':'Далее →';
  nb.onclick=advance;
}
function advance(){idx++;if(idx>=deck.length)finish();else render()}

function finish(){
  const total=deck.length, right=total-wrong.length, pct=Math.round(100*right/total);
  // Save last result only for quiz mode
  if (mode==='quiz'){ setLastResult(TOPIC_ID, pct); }
  refreshStatsBanner();
  document.getElementById('pbar').style.width='100%';
  document.getElementById('progressText').textContent=`${total}/${total}`;
  const c=passClass(pct);
  const passed = pct>=80;
  const verdict = passed?'🏆 Сдано (≥80%)':'❌ Не сдано (<80%)';
  let reviewHtml='';
  if(wrong.length){
    reviewHtml='<div class="review"><h3>Ошибки</h3>';
    wrong.forEach(i=>{
      const it=ALL_ITEMS[i];
      reviewHtml+=`<div class="review-item"><b>${esc(it.cram_q||it.q)}</b><br><small style="color:#666">${esc((it.cram_key||it.scen).slice(0,250))}</small><div class="ck">✓ ${esc(it.correct)}</div></div>`;
    });
    reviewHtml+='</div>';
  } else {
    reviewHtml='<div class="review empty"><h3>Ошибок нет 🎉</h3></div>';
  }
  const modeLabel = mode==='cram' ? 'Зубрёжка' : 'Тест';
  const buttonsHtml = passed
    ? `<div class="nav"><a class="btn secondary" href="index.html">← К темам</a></div>`
    : `<div class="nav">
         <button class="btn" onclick="startRun(false)">Повторить</button>
         <a class="btn secondary" href="index.html">← К темам</a>
       </div>`;
  document.getElementById('stage').innerHTML=`
    <div class="result">
      <div style="color:#666;font-size:13px">${modeLabel}</div>
      <div class="score ${c}">${right} / ${total}</div>
      <div class="verdict">${verdict} · ${pct}%</div>
      ${buttonsHtml}
      ${reviewHtml}
    </div>`;
}

fetch('data/topics.json').then(r=>r.json()).then(topics=>{
  const t=topics.find(x=>x.id===TOPIC_ID);
  TOPIC_NAME = t ? t.name : TOPIC_ID;
  document.title = TOPIC_NAME + ' — АиР';
  document.getElementById('title').textContent = (t?.emoji||'') + ' ' + TOPIC_NAME;
  return fetch('data/'+TOPIC_ID+'.json');
}).then(r=>r.json()).then(items=>{
  ALL_ITEMS=items;
  refreshStatsBanner();
  setMode('cram');
}).catch(e=>{document.getElementById('stage').innerHTML='<div style="color:#c00">Ошибка: '+e.message+'</div>'});
</script>
</body></html>
